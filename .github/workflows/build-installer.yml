name: Build Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      skip_pyinstaller:
        description: "Skip PyInstaller build (use cached)"
        type: boolean
        default: false
      skip_go:
        description: "Skip Go binary build (use cached)"
        type: boolean
        default: false
      skip_tools:
        description: "Skip downloading external tools (use cached)"
        type: boolean
        default: false
      pem_key:
        description: "Base64-encoded .pem key for .crx signing (optional, will be masked)"
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    name: Build Windows Installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Mask .pem key in logs (security)
        if: ${{ inputs.pem_key != '' }}
        run: echo "::add-mask::${{ inputs.pem_key }}"

      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Setup toolchain ──────────────────────────────────────────────────
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: go/go.sum

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller

      - name: Install npm dependencies
        run: npm ci

      # ── Cache external tools ─────────────────────────────────────────────
      - name: Cache external tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: packaging/installer-source/tools
          key: ${{ runner.os }}-tools-${{ hashFiles('packaging/build-installer.ps1') }}
          restore-keys: |
            ${{ runner.os }}-tools-

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      # ── Cache PyInstaller build ──────────────────────────────────────────
      - name: Cache PyInstaller build
        id: cache-pyinstaller
        uses: actions/cache@v4
        with:
          path: |
            packaging/installer-source/native-host/qwin-host.exe
            build/pyinstaller
          key: ${{ runner.os }}-pyinstaller-${{ hashFiles('packaging/pyinstaller.spec', 'src/native_host/**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-pyinstaller-

      # ── Cache Go binary ──────────────────────────────────────────────────
      - name: Cache Go binary
        id: cache-gobuild
        uses: actions/cache@v4
        with:
          path: packaging/installer-source/tools/capture/qwin-capture.exe
          key: ${{ runner.os }}-gobuild-${{ hashFiles('go/**/*.go', 'go/go.mod', 'go/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gobuild-

      # ── Stage the .pem key (if provided) ─────────────────────────────────
      - name: Write .pem key for .crx signing
        if: ${{ inputs.pem_key != '' }}
        shell: pwsh
        env:
          PEM_B64: ${{ inputs.pem_key }}
        run: |
          $pemBytes = [Convert]::FromBase64String($env:PEM_B64)
          [System.IO.File]::WriteAllBytes("$env:RUNNER_TEMP\key.pem", $pemBytes)
          echo "PEM_KEY_PATH=$env:RUNNER_TEMP\key.pem" >> $env:GITHUB_ENV

      # ── Build! ───────────────────────────────────────────────────────────
      - name: Build installer
        shell: pwsh
        run: |
          $args = @()

          # Skip steps where cache was hit
          if ("${{ steps.cache-pyinstaller.outputs.cache-hit }}" -eq "true") {
            $args += "-SkipPyInstaller"
          }
          if ("${{ steps.cache-gobuild.outputs.cache-hit }}" -eq "true") {
            $args += "-SkipGo"
          }
          if ("${{ steps.cache-tools.outputs.cache-hit }}" -eq "true") {
            $args += "-SkipTools"
          }

          # Manual skip inputs (override cache decisions)
          if ("${{ inputs.skip_pyinstaller }}" -eq "true") { $args += "-SkipPyInstaller" }
          if ("${{ inputs.skip_go }}" -eq "true") { $args += "-SkipGo" }
          if ("${{ inputs.skip_tools }}" -eq "true") { $args += "-SkipTools" }

          # .pem key for .crx signing
          if ($env:PEM_KEY_PATH) {
            $args += "-PemKey"
            $args += "$env:PEM_KEY_PATH"
          }

          Write-Host "Build arguments: $($args -join ' ')"
          .\packaging\build-installer.ps1 @args -PythonCmd "python"

      # ── Upload installer as artifact ─────────────────────────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qwin-Video-Downloader-Setup
          path: dist/Qwin-Video-Downloader-v*-Setup.exe
          retention-days: 30
          compression-level: 0

      # ── Create release (on tag push only) ────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Qwin Video Downloader ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_glob: true
          files: |
            dist/Qwin-Video-Downloader-v*-Setup.exe
