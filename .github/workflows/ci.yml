name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install npm dependencies
        run: npm install

      - name: Install Ruff (Python linter)
        run: pip install ruff

      - name: ESLint (JavaScript)
        run: npx eslint src/

      - name: Prettier check (JavaScript/CSS/JSON)
        run: npx prettier --check "src/**/*.{js,css,json}" "*.{json,js}"

      - name: Ruff lint (Python)
        run: python -m ruff check src/native_host/

      - name: Ruff format check (Python)
        run: python -m ruff format --check src/native_host/

  build:
    name: Build extension targets
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install npm dependencies
        run: npm install

      - name: Build extension targets (chromium, firefox, yandex)
        shell: pwsh
        run: scripts\build-extension.ps1 -Target all
