<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Qwin Video Downloader</title>
  </head>
  <!--
    Shell only (spec §5.1, §5.2, D5, D10). Every control, every panel and every id that
    used to live here is now a Preact component reading a signal from
    `src/popup/state/`, so a re-render is the only way state changes. The five hidden
    mirror controls are gone with it - see §12's mitigation on the hidden form.

    Three roots, one reason each (spec §5.2 "shell + 3 roots"):

      #popupApp       the frame: header, dependency banner, view switch, the active
                      view, the footer, and the resize grip. One tree, because
                      `useResize` owns `document.body.style.width` and two hook
                      instances would fight over it.
      #selectionBar   the sticky selection bar (spec §6.9). Its own root because it is
                      a fixed layer with no parent in the flow to inherit a
                      positioning context from, and it reads the module-level
                      `useStickySelection` signal, so it needs no props from the frame.
      #qualityDialog  the format chooser, shared with the in-page overlay.

    `<body>` carries no width and no background: `useResize` owns the width (D5,
    400-720px, default 460) and D10 wants the popup transparent so the chrome's
    `backdrop-filter` reads as depth against the desktop rather than as a white page.
    Every surface paints itself from `ui/theme.css`.
  -->
  <body>
    <div id="popupApp"></div>
    <div id="selectionBar"></div>
    <div id="qualityDialog"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
